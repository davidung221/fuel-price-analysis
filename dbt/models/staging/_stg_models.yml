version: 2

models:
  - name: stg_history_prices
    description: >
      Price changes from the monthly history files, cleaned. One row per price change
      per station per fuel type. All of NSW. Exact duplicates removed; outliers flagged, not removed.
    columns:
      - name: station_key
        description: Built from station name + address (history files have no station code)
        data_tests:
          - not_null
      - name: fuel_code
        data_tests:
          - not_null
      - name: price_updated_at
        description: When the price changed, Sydney local time
        data_tests:
          - not_null
      - name: price_cpl
        description: Price in cents per litre
        data_tests:
          - not_null
      - name: is_outlier
        description: True for petrol/diesel prices under 100 c/L (likely data entry errors)
      - name: is_fuel
        description: False for EV charging prices

  - name: stg_api_prices
    description: >
      Price changes from the daily API snapshots, cleaned. One row per price change
      per station per fuel type. All of NSW. Repeated (unchanged) snapshot rows grouped into one.
    columns:
      - name: station_code
        description: Joins to stg_api_stations.station_code
        data_tests:
          - not_null
      - name: fuel_code
        data_tests:
          - not_null
      - name: price_cpl
        description: Cents per litre (EV entries are almost all 0, see data notes)
        data_tests:
          - not_null
      - name: price_updated_at
        description: When the price changed, Sydney local time (converted from UTC)
        data_tests:
          - not_null
      - name: price_age_days
        description: Days from the price's last update to the last snapshot that showed it
      - name: is_current
        description: True if the price appears in the latest snapshot
      - name: is_stale
        description: True if the price had not been updated for more than 7 days
      - name: is_outlier
        description: True for petrol/diesel prices under 100 c/L
      - name: is_fuel
        description: False for EV entries

  - name: stg_api_stations
    description: >
      Stations from the daily API snapshots, cleaned. One row per station, using its
      latest details. Suburb and postcode split out of the address. All of NSW.
    columns:
      - name: station_code
        description: Station identifier, joins to stg_api_prices.station_code
        data_tests:
          - unique
          - not_null
      - name: station_name
        data_tests:
          - not_null
      - name: suburb
        description: Taken from the address (uppercase)
        data_tests:
          - not_null:
              config:
                severity: warn   # a few addresses may not follow the usual format
      - name: postcode
        description: Last 4 digits of the address
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: is_active
        description: True if the station is in the latest snapshot
