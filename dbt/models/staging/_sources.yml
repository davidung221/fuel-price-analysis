# The raw tables dbt reads from. Models refer to them as
# {{ source('raw', 'table_name') }} instead of typing full table names.
version: 2

sources:
  - name: raw
    description: Data as received from the FuelCheck history files and API. Loaded by Python scripts.
    schema: raw   # BigQuery dataset

    tables:
      - name: fuel_price_history
        description: >
          Every price change from the monthly history files, Nov 2024 - Oct 2026.
          Loaded by load_history_to_bq.py. PriceUpdatedDate is Sydney local time.
        config:
          loaded_at_field: loaded_at
          freshness:
            # Reminder to load the next monthly history file
            warn_after: {count: 45, period: day}

      - name: api_prices
        description: >
          Daily snapshot of current prices from the FuelCheck API.
          Loaded by extract_prices.py. lastupdated is UTC.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 36, period: hour}   # one daily run missed
            error_after: {count: 72, period: hour}  # three runs missed

      - name: api_stations
        description: Daily snapshot of stations from the FuelCheck API. Loaded by extract_prices.py.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 72, period: hour}
